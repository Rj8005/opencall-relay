plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.opencall.relay'
    compileSdk 34
    defaultConfig {
        applicationId "com.opencall.relay"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    signingConfigs {
        release {
            storeFile file("../opencall-release.jks")
            storePassword "opencall123"
            keyAlias "opencall"
            keyPassword "opencall123"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
            applicationIdSuffix ""
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'io.github.webrtc-sdk:android:114.5735.07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'io.michaelrocks:libphonenumber-android:8.13.14'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // PHASE 7A: real cryptographic identity — plain JCA "Ed25519" (Conscrypt) is
    // only available on API 31+; this project's minSdk is 26, so a portable
    // software Ed25519 implementation is required for API 26-30. BouncyCastle is
    // the de facto standard choice (widely audited, actively maintained) — see
    // OfflineIdentity.kt's class doc for how it's used (lightweight API, no JCA
    // Provider registration needed for Ed25519 specifically).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // PHASE 5A: first JVM-only unit tests in this project (MeshLocationTest) — pure
    // Kotlin codec, no Android/Robolectric dependency needed.
    testImplementation 'junit:junit:4.13.2'
}